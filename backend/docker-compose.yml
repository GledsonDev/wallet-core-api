version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-wallet}
      POSTGRES_PASSWORD: ${DB_PASS:-wallet_pass}
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wallet_redis
    ports:
      - "6379:6379"
    volumes:
    pgdata:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: wallet_rabbitmq
    ports:
      - "5672:5672"   # Porta padrão do mensageiro
      - "15672:15672" # Painel visual de gestão