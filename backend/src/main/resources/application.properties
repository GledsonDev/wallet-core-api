# Banco de Dados (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASS}
quarkus.hibernate-orm.database.generation=update

# Cache (Redis)
quarkus.redis.hosts=${REDIS_URL}

# Mensageria (RabbitMQ)
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest

# RabbitMQ Exchange Configuration
mp.messaging.outgoing.transaction-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.transaction-out.exchange.name=transactions-exchange

# RabbitMQ Incoming Configuration
mp.messaging.incoming.transaction-in.connector=smallrye-rabbitmq
mp.messaging.incoming.transaction-in.queue.name=transactions-queue
mp.messaging.incoming.transaction-in.exchange.name=transactions-exchange

quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

wallet.security.secret-key=${WALLET_SECRET_KEY}
mp.jwt.verify.issuer=${JWT_ISSUER}

quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}

quarkus.package.type=fast-jar

quarkus.swagger-ui.always-include=true