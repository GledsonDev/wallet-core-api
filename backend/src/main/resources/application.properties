# Banco de Dados (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=wallet
quarkus.datasource.password=wallet_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/wallet_db
quarkus.hibernate-orm.database.generation=update

# Cache (Redis)
quarkus.redis.hosts=redis://localhost:6379

# Mensageria (RabbitMQ)
rabbitmq-host=localhost
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest

# RabbitMQ Exchange Configuration
mp.messaging.outgoing.transaction-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.transaction-out.exchange.name=transactions-exchange

# RabbitMQ Incoming Configuration
mp.messaging.incoming.transaction-in.connector=smallrye-rabbitmq
mp.messaging.incoming.transaction-in.queue.name=transactions-queue
mp.messaging.incoming.transaction-in.exchange.name=transactions-exchange